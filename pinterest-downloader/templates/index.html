<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Pinterest Video Downloader</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #e60023;
    --accent-dark: #b3001a;
    --border: #e2e2e5;
    --ok: #1a8a3d;
    --fail: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 140px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  input[type=text] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .row { display: flex; gap: 16px; margin-top: 16px; align-items: flex-end; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 200px; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: #c9c9cc; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .progress-outer {
    background: #eee;
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin: 12px 0 8px;
  }
  .progress-inner {
    background: var(--accent);
    height: 100%;
    width: 0%;
    transition: width .3s;
  }
  .status-line { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  .log {
    background: #111;
    color: #d6d6d6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    border-radius: 10px;
    padding: 12px;
    height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 12px;
  }
  .summary { display: flex; gap: 20px; margin-top: 12px; font-size: 14px; }
  .summary b.ok { color: var(--ok); }
  .summary b.fail { color: var(--fail); }
  ul.filelist { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.filelist li {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  ul.filelist a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .size { color: var(--muted); font-size: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pinterest Video Downloader</h1>
  <p class="subtitle">Cole os links, escolha o nome da pasta e baixe tudo de uma vez.</p>

  <div class="card">
    <label for="links">Links do Pinterest (um por linha)</label>
    <textarea id="links" placeholder="https://www.pinterest.com/pin/111111111111111111/&#10;https://www.pinterest.com/pin/222222222222222222/&#10;https://pin.it/abc123"></textarea>

    <div class="row">
      <div class="field">
        <label for="output">Nome da pasta de destino</label>
        <input type="text" id="output" value="downloads" placeholder="ex: videos-cliente-x">
      </div>
      <button id="startBtn" onclick="startDownload()">Baixar todos</button>
    </div>
    <p class="hint">Os videos vao para <code>pinterest-downloader/downloads/&lt;pasta&gt;/</code>, nomeados com o titulo de cada pin.</p>
  </div>

  <div class="card hidden" id="progressCard">
    <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>
    <div class="status-line">
      <span id="statusText">Preparando...</span>
      <span id="percentText"></span>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="summary">
      <span><b class="ok" id="okCount">0</b> sucesso(s)</span>
      <span><b class="fail" id="failCount">0</b> falha(s)</span>
    </div>
    <ul class="filelist" id="fileList"></ul>
  </div>
</div>

<script>
let polling = null;

function fmtSize(bytes) {
  if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  return (bytes / 1024).toFixed(0) + " KB";
}

async function startDownload() {
  const links = document.getElementById('links').value;
  const output = document.getElementById('output').value;
  const btn = document.getElementById('startBtn');

  btn.disabled = true;
  document.getElementById('progressCard').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('log').textContent = '';

  const res = await fetch('/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({links, output})
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || 'Erro ao iniciar.');
    btn.disabled = false;
    return;
  }
  polling = setInterval(pollStatus, 1000);
}

async function pollStatus() {
  const res = await fetch('/status');
  const s = await res.json();

  const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('statusText').textContent =
    s.running ? `Baixando ${s.done + 1}/${s.total}` : (s.total ? 'Concluido' : 'Preparando...');
  document.getElementById('percentText').textContent = s.running ? (s.percent || '') : '';
  document.getElementById('log').textContent = (s.log || []).join('\n');
  document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;

  if (!s.running && s.total > 0) {
    clearInterval(polling);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('okCount').textContent = s.ok.length;
    document.getElementById('failCount').textContent = s.fail.length;
    await loadFiles();
    document.getElementById('resultCard').classList.remove('hidden');
  }
}

async function loadFiles() {
  const res = await fetch('/files');
  const data = await res.json();
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  (data.files || []).forEach(f => {
    const li = document.createElement('li');
    const link = document.createElement('a');
    link.href = `/downloads/${encodeURIComponent(data.folder)}/${encodeURIComponent(f.name)}`;
    link.textContent = f.name;
    link.target = '_blank';
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = fmtSize(f.size);
    li.appendChild(link);
    li.appendChild(size);
    list.appendChild(li);
  });
}
</script>
</body>
</html>
